<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba478"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#avatarBg)"/>
  
  <!-- Developer Avatar Body -->
  <path d="M 24,115 C 24,90 40,82 60,82 C 80,82 96,90 96,115 Z" fill="url(#hoodie)"/>
  
  <!-- Neck -->
  <rect x="52" y="65" width="16" height="20" rx="6" fill="url(#skin)"/>
  
  <!-- Head -->
  <ellipse cx="60" cy="54" rx="22" ry="26" fill="url(#skin)"/>
  
  <!-- Hair / Cap -->
  <path d="M 38,50 C 38,32 50,22 60,22 C 72,22 82,32 82,50 C 76,44 68,42 60,42 C 52,42 44,44 38,50 Z" fill="#1e1b4b"/>
  
  <!-- Glasses -->
  <rect x="44" y="48" width="14" height="10" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="62" y="48" width="14" height="10" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <line x1="58" y1="52" x2="62" y2="52" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Smile -->
  <path d="M 54,68 Q 60,74 66,68" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
</svg>
