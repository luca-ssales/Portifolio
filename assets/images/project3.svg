<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="spiral1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="30%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="spiral2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>

  <!-- 3D Ribbon Torus / Spiral -->
  <g filter="url(#shadow)" transform="translate(250, 250)">
    <!-- Back loops -->
    <path d="M -130,-40 C -150,-120 -50,-170 50,-150 C 150,-130 180,-30 140,60 C 100,150 0,170 -90,130 C -150,100 -120,10 -80,-5" fill="none" stroke="url(#spiral1)" stroke-width="48" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Middle loops -->
    <path d="M -90,100 C -150,30 -120,-80 -40,-130 C 50,-180 160,-110 160,-20 C 160,80 70,160 -30,150 C -110,140 -130,50 -70,-30" fill="none" stroke="url(#spiral2)" stroke-width="42" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Front loop overlay -->
    <path d="M -60,-110 C 20,-160 140,-100 130,0 C 120,90 20,150 -60,110 C -120,80 -100,-20 -40,-70" fill="none" stroke="url(#spiral1)" stroke-width="36" stroke-linecap="round"/>

    <circle cx="20" cy="-20" r="14" fill="#ffffff" opacity="0.8" filter="url(#glow)"/>
    <circle cx="-50" cy="50" r="8" fill="#38bdf8" opacity="0.9"/>
    <circle cx="80" cy="60" r="10" fill="#ec4899" opacity="0.7"/>
  </g>
</svg>
